services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: chronovault
      POSTGRES_USER: ${POSTGRES_USER:-chronovault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chronovault}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chronovault}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: chronovault
      POSTGRES_USER: ${POSTGRES_USER:-chronovault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chronovault}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-cv-local-dev-jwt-secret-key-at-least-256-bits-long-for-hs256-algorithm}
      CHRONOVAULT_MASTER_KEY: ${CHRONOVAULT_MASTER_KEY:-a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2}
      CHRONOVAULT_RESTIC_PASSWORD: ${CHRONOVAULT_RESTIC_PASSWORD:-d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5}
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
      MIMO_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
