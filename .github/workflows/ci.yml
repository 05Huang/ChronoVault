name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: chronovault
          POSTGRES_USER: chronovault
          POSTGRES_PASSWORD: chronovault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chronovault"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile
        run: mvn compile -B
        working-directory: backend
      - name: Test
        run: mvn test -B
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Type check
        run: npx vue-tsc --noEmit
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  agent:
    name: Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: agent/go.sum
      - name: Build
        run: go build ./...
        working-directory: agent
      - name: Test
        run: go test ./... -v
        working-directory: agent
