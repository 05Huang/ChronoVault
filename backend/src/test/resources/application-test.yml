spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

chronovault:
  master-key: test-master-key-for-unit-tests
  restic-password: test-restic-password
  ssh:
    connection-timeout: 5000
    command-timeout: 10000
    max-retry: 1
  ai:
    enabled: false
    base-url: http://localhost:9999/v1
    api-key: test-key

logging:
  level:
    com.chronovault: WARN
