spring:
  application:
    name: chronovault-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 100
      thread-name-prefix: cv-task-

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
        generate_statistics: false
        order_inserts: true
        order_updates: true
        batch_size: 25

  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
      leak-detection-threshold: 60000
      pool-name: ChronoVaultHikariPool

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.chronovault: DEBUG
    org.springframework.security: INFO

# OpenAPI / Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

# ChronoVault configuration
chronovault:
  master-key: ${CHRONOVAULT_MASTER_KEY:}
  restic-password: ${CHRONOVAULT_RESTIC_PASSWORD:}
  ssh:
    connection-timeout: 30000
    command-timeout: 60000
    max-connections-per-server: 3
    keepalive-interval: 30000
    max-retry: 2
    idle-eviction-millis: 300000
    strict-host-checking: ${CHRONOVAULT_SSH_STRICT_HOST_CHECKING:false}
    known-hosts-file: ${CHRONOVAULT_SSH_KNOWN_HOSTS_FILE:}
  ai:
    enabled: true
    base-url: ${MIMO_BASE_URL:https://api.xiaomimimo.com/v1}
    api-key: ${MIMO_API_KEY:}
    model: ${MIMO_MODEL:mimo-v2.5-pro}
    max-tokens: 4096
    temperature: 0.7
  agent:
    heartbeat-interval: 30000
    task-poll-interval: 10000
    server-url: ${CHRONOVAULT_SERVER_URL:}
    binary-path: ${CHRONOVAULT_AGENT_BINARY:}
