spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB:chronovault}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 20000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms

  jpa:
    show-sql: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

chronovault:
  ai:
    enabled: ${MIMO_ENABLED:false}
    base-url: ${MIMO_BASE_URL:https://api.xiaomimimo.com/v1}
    api-key: ${MIMO_API_KEY:}
    model: ${MIMO_MODEL:mimo-v2.5-pro}
    max-tokens: 8192
  ssh:
    known-hosts-file: ${SSH_KNOWN_HOSTS_FILE:/etc/chronovault/known_hosts}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.chronovault: INFO
    org.springframework.security: WARN
